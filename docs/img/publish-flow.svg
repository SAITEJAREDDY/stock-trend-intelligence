<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-label="Publish flow: an agent version is published as an Agent Application with its own endpoint and identity, deployed, and called by clients with an Entra token; tool calls then use the new application identity, so roles must be re-assigned.">
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker><marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker></defs>
<rect width="1100" height="540" rx="24" fill="#0f172a"/>
<text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#fff" >What publishing really creates</text>
<text x="40" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#94a3b8" >Original diagram of the publish flow described in the Microsoft Foundry publish-an-agent documentation.</text>
<rect x="40" y="120" width="220" height="100" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2" /><text x="150" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Agent version</text><text x="150" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">in your development</text><text x="150" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">project</text>
<path d="M260 170 L340 170" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#b)"/>
<text x="300" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#93c5fd" text-anchor="middle">publish</text>
<rect x="340" y="110" width="340" height="120" rx="14" fill="#2e1065" stroke="#a78bfa" stroke-width="2" /><text x="510" y="137" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Agent Application</text><text x="510" y="159" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">stable invocation URL</text><text x="510" y="181" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">own Entra agent identity + blueprint</text><text x="510" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Responses or Activity protocol</text>
<path d="M680 170 L760 170" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#p)"/>
<rect x="760" y="120" width="300" height="100" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2" /><text x="910" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Deployment</text><text x="910" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">runs one agent version</text><text x="910" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">start / stop lifecycle</text>
<rect x="340" y="320" width="340" height="100" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2" /><text x="510" y="348" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Callers: your app, Teams, M365</text><text x="510" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Entra token for https://ai.azure.com</text><text x="510" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">no API keys, needs Foundry User</text>
<path d="M510 320 L510 232" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#b)"/>
<text x="524" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#93c5fd" >call the endpoint</text>
<rect x="760" y="320" width="300" height="100" rx="14" fill="#134e4a" stroke="#2dd4bf" stroke-width="2" /><text x="910" y="348" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">MCP server on /mcp</text><text x="910" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">validates the token</text><text x="910" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">needs Mcp.Invoke</text>
<path d="M910 222 L910 320" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#y)"/>
<text x="924" y="278" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#fcd34d" >tool call as the</text><text x="924" y="294" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fcd34d" >NEW identity</text>
<rect x="40" y="320" width="220" height="100" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2" /><text x="150" y="348" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Who can publish</text><text x="150" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Foundry Project Manager</text><text x="150" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">on the account scope</text>
<rect x="40" y="445" width="1020" height="70" rx="14" fill="#3b2a05" stroke="#fbbf24" stroke-width="2"/>
<text x="60" y="474" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fbbf24" >The trap:</text><text x="135" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#fef3c7" >publishing switches tool calls from the project identity to the application identity. Permissions do not transfer.</text>
<text x="60" y="500" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fbbf24" >Fix:</text><text x="98" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#fef3c7" >re-assign the MCP app role (and any other downstream role) to the new application identity after every publish.</text>
</svg>
