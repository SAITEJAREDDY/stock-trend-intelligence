<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-label="Agent identity model: an agent identity blueprint creates an agent identity that starts with no permissions; a role assignment grants it access to the MCP API, while everything else stays blocked.">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker></defs>
<rect width="1100" height="540" rx="24" fill="#0f172a"/>
<text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#fff" >Who is the agent, and what can it touch?</text>
<text x="40" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#94a3b8" >Original diagram of the identity model described in the Microsoft Foundry agent identity documentation.</text>
<rect x="40" y="95" width="360" height="330" rx="18" fill="#111c33" stroke="#a78bfa" stroke-width="2"/>
<text x="220" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa" text-anchor="middle">MICROSOFT ENTRA ID</text>
<rect x="60" y="140" width="320" height="100" rx="14" fill="#2e1065" stroke="#a78bfa" stroke-width="2" /><text x="220" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Agent identity blueprint</text><text x="220" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">parent template and governing object</text><text x="220" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">federated credential, no secret to store</text>
<rect x="60" y="300" width="320" height="100" rx="14" fill="#2e1065" stroke="#a78bfa" stroke-width="2" /><text x="220" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Agent identity</text><text x="220" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">a service principal under the blueprint</text><text x="220" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">starts with NO permissions</text>
<line x1="220" y1="240" x2="220" y2="300" stroke="#a78bfa" stroke-width="3" marker-end="url(#a)"/>
<text x="234" y="276" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#c4b5fd" >creates one per agent</text>
<rect x="640" y="140" width="420" height="100" rx="14" fill="#134e4a" stroke="#2dd4bf" stroke-width="2" /><text x="850" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Your MCP server API</text><text x="850" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">audience: api://&lt;mcp-app-id&gt;</text><text x="850" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">app role: Mcp.Invoke</text>
<rect x="640" y="300" width="420" height="100" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><text x="850" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">Everything else</text><text x="850" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">storage, subscriptions, other tools</text><text x="850" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">no access unless you grant it</text>
<path d="M380 335 L510 335 L510 190 L640 190" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#g)"/>
<text x="520" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#5eead4" >role assignment</text>
<text x="520" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#5eead4" >by object ID,</text>
<text x="520" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#5eead4" >least privilege</text>
<line x1="380" y1="375" x2="640" y2="375" stroke="#64748b" stroke-width="3" stroke-dasharray="7 5"/>
<g stroke="#f87171" stroke-width="4" stroke-linecap="round"><line x1="496" y1="364" x2="516" y2="386"/><line x1="516" y1="364" x2="496" y2="386"/></g>
<text x="506" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#fca5a5" text-anchor="middle">blocked by default</text>
<rect x="40" y="445" width="1020" height="70" rx="14" fill="#1e293b"/>
<text x="60" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" >Legacy model:</text><text x="165" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#e2e8f0" >one shared identity for the whole project, so you cannot scope permissions or audit to a single agent.</text>
<text x="60" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#34d399" >Current model:</text><text x="165" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#e2e8f0" >each agent gets its own blueprint and identity, so permissions and audit logs follow the agent.</text>
</svg>
