<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-label="Six review gates from intake to periodic review and retirement. Gate 0 passed, Gate 1 passed with one recorded exception, Gates 2 and 3 are not yet met, and Gates 4 and 5 come later.">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect width="1100" height="400" rx="24" fill="#0f172a"/>
<text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#fff" >Where this project sits in the review gates</text>
<text x="40" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#94a3b8" >Each gate opens only when its evidence is attached and a named approver signs.</text>
<rect x="40" y="105" width="150" height="86" rx="14" fill="#0d2420" stroke="#34d399" stroke-width="2.5"/><text x="115" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">Gate 0</text><text x="115" y="162" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Intake</text><line x1="190" y1="148" x2="212" y2="148" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="205" width="150" height="30" rx="15" fill="#0d2420" stroke="#34d399" stroke-width="1.5"/><text x="115" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">PASSED</text><text x="115" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">Owner, purpose and</text><text x="115" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">data class clear?</text><rect x="212" y="105" width="150" height="86" rx="14" fill="#3b2a05" stroke="#fbbf24" stroke-width="2.5"/><text x="287" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">Gate 1</text><text x="287" y="162" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Design</text><line x1="362" y1="148" x2="384" y2="148" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="212" y="205" width="150" height="30" rx="15" fill="#3b2a05" stroke="#fbbf24" stroke-width="1.5"/><text x="287" y="225" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">PASSED WITH EXCEPTION</text><text x="287" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">Identities, tools and</text><text x="287" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">exceptions recorded?</text><rect x="384" y="105" width="150" height="86" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/><text x="459" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">Gate 2</text><text x="459" y="162" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Pre-production</text><line x1="534" y1="148" x2="556" y2="148" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="384" y="205" width="150" height="30" rx="15" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/><text x="459" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">NOT YET</text><text x="459" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">Did negative tests</text><text x="459" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">fail as expected?</text><rect x="556" y="105" width="150" height="86" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/><text x="631" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">Gate 3</text><text x="631" y="162" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Go-live</text><line x1="706" y1="148" x2="728" y2="148" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="556" y="205" width="150" height="30" rx="15" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/><text x="631" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">NOT YET</text><text x="631" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">Can we operate it and</text><text x="631" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">shut it off?</text><rect x="728" y="105" width="150" height="86" rx="14" fill="#111827" stroke="#64748b" stroke-width="2.5"/><text x="803" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">Gate 4</text><text x="803" y="162" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">30-day review</text><line x1="878" y1="148" x2="900" y2="148" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="728" y="205" width="150" height="30" rx="15" fill="#111827" stroke="#64748b" stroke-width="1.5"/><text x="803" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">LATER</text><text x="803" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">Does real usage</text><text x="803" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">match the design?</text><rect x="900" y="105" width="150" height="86" rx="14" fill="#111827" stroke="#64748b" stroke-width="2.5"/><text x="975" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">Gate 5</text><text x="975" y="162" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Periodic / retire</text><rect x="900" y="205" width="150" height="30" rx="15" fill="#111827" stroke="#64748b" stroke-width="1.5"/><text x="975" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">LATER</text><text x="975" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">Still needed with</text><text x="975" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">these permissions?</text>
