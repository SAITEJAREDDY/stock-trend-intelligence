<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" role="img" aria-label="Architecture diagram: Telegram users and an Azure Foundry agent both call one Python backend on Render, which pulls prices from Yahoo Finance through yfinance, computes statistics and renders charts.">
<defs>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
</defs>
<rect width="1280" height="740" rx="24" fill="#0f172a"/>
<text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#fff">How it's built</text>
<text x="40" y="68" font-family="Arial, Helvetica, sans-serif" font-size="15"  fill="#94a3b8">Two front doors, one shared brain: Telegram and Azure Foundry both call the same Python backend.</text>
<text text-anchor="middle" x="120" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#64748b">FRONT DOORS</text>
<text text-anchor="middle" x="395" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#64748b">MESSAGING / AGENT LAYER</text>
<text text-anchor="middle" x="1130" y="128" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#64748b">DATA SOURCE</text>
<rect x="590" y="90" width="350" height="500" rx="18" fill="#111c33" stroke="#2dd4bf" stroke-width="2"/>
<text x="765" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2dd4bf" text-anchor="middle">Render (Free plan, Docker)</text>
<text x="765" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Python 3.12 · server.py · /health</text>
<rect x="610" y="155" width="310" height="70" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="765" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Telegram webhook + worker</text><text x="765" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">1 worker · 4-item queue · 1 analysis/min/chat</text>
<rect x="610" y="255" width="310" height="215" rx="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="765" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">SHARED CALCULATION CODE</text>
<rect x="625" y="284" width="280" height="52" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/><text x="765" y="306" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Analysis engine</text><text x="765" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">returns · correlation · volatility · drawdown</text>
<rect x="625" y="346" width="280" height="52" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/><text x="765" y="368" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Chart renderer</text><text x="765" y="388" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">5 PNG chart types from real observations</text>
<rect x="625" y="408" width="280" height="48" rx="12" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/><text x="765" y="428" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Caches</text><text x="765" y="448" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">15-min data · 1-hour chart links</text>
<rect x="610" y="500" width="310" height="70" rx="12" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="765" y="531" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">MCP server  /mcp</text><text x="765" y="551" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">get_stock_history · read-only · public data</text>
<line x1="765" y1="225" x2="765" y2="255" stroke="#60a5fa" stroke-width="3"  marker-end="url(#aB)" />
<line x1="765" y1="500" x2="765" y2="470" stroke="#a78bfa" stroke-width="3"  marker-end="url(#aP)" />
<rect x="30" y="150" width="180" height="90" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/><text x="120" y="191" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">You on Telegram</text><text x="120" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">private chat with your bot</text>
<rect x="290" y="150" width="210" height="90" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/><text x="395" y="191" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Telegram Bot API</text><text x="395" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">webhook delivery</text>
<rect x="30" y="480" width="180" height="90" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="120" y="521" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">You in Foundry</text><text x="120" y="541" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">agent playground / client</text>
<rect x="290" y="480" width="210" height="90" rx="12" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="395" y="508" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Azure Foundry agent</text><text x="395" y="528" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">GPT-5 mini (tested)</text><text x="395" y="546" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">tool: YahooStockHistory</text>
<rect x="1010" y="300" width="240" height="110" rx="12" fill="#3b2a05" stroke="#fbbf24" stroke-width="2"/><text x="1130" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Yahoo Finance</text><text x="1130" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">via yfinance (unofficial)</text><text x="1130" y="366" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">daily + 5-min history</text>
<line x1="210" y1="195" x2="290" y2="195" stroke="#60a5fa" stroke-width="3"  marker-end="url(#aB)" /><circle cx="250" cy="178" r="11" fill="#60a5fa"/><text x="250" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">1</text>
<line x1="500" y1="175" x2="610" y2="175" stroke="#60a5fa" stroke-width="3"  marker-end="url(#aB)" /><circle cx="555" cy="160" r="11" fill="#60a5fa"/><text x="555" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">2</text>
<line x1="610" y1="208" x2="500" y2="208" stroke="#60a5fa" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#aB)" /><circle cx="555" cy="232" r="11" fill="#60a5fa"/><text x="555" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">4</text>
<line x1="920" y1="355" x2="1010" y2="355" stroke="#fbbf24" stroke-width="3"  marker-end="url(#aA)" marker-start="url(#aA)"/><circle cx="965" cy="336" r="11" fill="#fbbf24"/><text x="965" y="341" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">3</text>
<line x1="210" y1="525" x2="290" y2="525" stroke="#a78bfa" stroke-width="3"  marker-end="url(#aP)" /><text text-anchor="middle" x="250" y="515" font-family="Arial, Helvetica, sans-serif" font-size="11"  fill="#c4b5fd">prompt</text>
<line x1="500" y1="515" x2="610" y2="515" stroke="#a78bfa" stroke-width="3"  marker-end="url(#aP)" /><circle cx="555" cy="498" r="11" fill="#a78bfa"/><text x="555" y="503" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>
<line x1="610" y1="550" x2="500" y2="550" stroke="#a78bfa" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#aP)" /><circle cx="555" cy="574" r="11" fill="#a78bfa"/><text x="555" y="579" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">B</text>
<text x="40" y="630" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#60a5fa">Telegram path (no Azure model calls)</text>
<text x="40" y="654" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#e2e8f0">1  You send COMPARE MSFT NVDA</text>
<text x="40" y="676" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#e2e8f0">2  Telegram posts it to the webhook (HTTPS, secret header)</text>
<text x="40" y="698" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#e2e8f0">3  Backend pulls Yahoo history, does the math, draws the charts</text>
<text x="40" y="720" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#e2e8f0">4  Summary and PNG charts are uploaded back to your chat</text>
<text x="700" y="630" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#a78bfa">Foundry path</text>
<text x="700" y="654" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#e2e8f0">A  Agent calls get_stock_history over MCP (HTTPS)</text>
<text x="700" y="676" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#e2e8f0">B  Backend runs the same code and replies with compact</text>
<text x="700" y="698" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#e2e8f0">    results and chart links, not years of raw CSV</text>
</svg>
