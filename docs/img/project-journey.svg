<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-label="Project timeline in seven steps: Code Interpreter tried first, Alpha Vantage needed a key, yfinance MCP wrapper, Render deployment, approvals failed in the playground, token-rate errors on raw series with math moved to Python, and Telegram added.">
<rect width="1100" height="380" rx="24" fill="#0f172a"/>
<text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#fff" >How the design changed along the way</text>
<text x="40" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14"  fill="#94a3b8" >Built from the project decisions recorded in these notes. Amber steps are obstacles that changed the design.</text>
<line x1="60" y1="190" x2="1040" y2="190" stroke="#475569" stroke-width="3"/>
<circle cx="95" cy="190" r="20" fill="#134e4a" stroke="#2dd4bf" stroke-width="3"/><text x="95" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="95" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Code Interpreter</text><text x="95" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">tried first</text><text x="95" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">later removed</text><text x="95" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">from the agent</text><circle cx="247" cy="190" r="20" fill="#3b2a05" stroke="#fbbf24" stroke-width="3"/><text x="247" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="247" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Alpha Vantage</text><text x="247" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">needs a key</text><text x="247" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">not completed;</text><text x="247" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">no-key route chosen</text><circle cx="399" cy="190" r="20" fill="#134e4a" stroke="#2dd4bf" stroke-width="3"/><text x="399" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="399" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">yfinance wrapper</text><text x="399" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">as MCP server</text><text x="399" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">Streamable HTTP;</text><text x="399" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">OpenAPI option off</text><circle cx="551" cy="190" r="20" fill="#134e4a" stroke="#2dd4bf" stroke-width="3"/><text x="551" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="551" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Render Free plan</text><text x="551" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">deployment</text><text x="551" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">Docker, /health,</text><text x="551" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">deploys from GitHub</text><circle cx="703" cy="190" r="20" fill="#3b2a05" stroke="#fbbf24" stroke-width="3"/><text x="703" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="703" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Approvals failed</text><text x="703" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">in playground</text><text x="703" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">one tool</text><text x="703" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">allow-listed</text><circle cx="855" cy="190" r="20" fill="#3b2a05" stroke="#fbbf24" stroke-width="3"/><text x="855" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="855" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Token-rate errors</text><text x="855" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">on raw series</text><text x="855" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">math and charts</text><text x="855" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">moved to Python</text><circle cx="1007" cy="190" r="20" fill="#134e4a" stroke="#2dd4bf" stroke-width="3"/><text x="1007" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">7</text><text x="1007" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Telegram added</text><text x="1007" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">webhook + queue</text><text x="1007" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">no model calls,</text><text x="1007" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12"  fill="#cbd5e1" text-anchor="middle">private chats only</text>
<circle cx="60" cy="330" r="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="3"/><text x="78" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#cbd5e1" >built or decided</text>
<circle cx="240" cy="330" r="8" fill="#3b2a05" stroke="#fbbf24" stroke-width="3"/><text x="258" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13"  fill="#cbd5e1" >obstacle that changed the design</text>
